name: yangmao-radar
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: python3 radar.py
      - if: steps.r.outputs.hits != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          for h in json.load(open("new_hits.json")):
              body = f"来源：{h['src']}\n链接：{h['link']}\n\n{h['snippet']}"
              subprocess.run(["gh","issue","create","--title",f"[{h['src']}] {h['title']}"[:250],"--body",body,"--label","hit"], check=False)
          PY
      - run: |
          git config user.name radar-bot
          git config user.email radar-bot@users.noreply.github.com
          git add seen.json hits.jsonl
          git diff --cached --quiet || git commit -m "radar: update state" && git push || true
